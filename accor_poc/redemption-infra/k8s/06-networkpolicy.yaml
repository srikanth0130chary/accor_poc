apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: redemption
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redemption-app-allow
  namespace: redemption
spec:
  podSelector:
    matchLabels:
      app: redemption-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only traffic arriving from the ALB (via the AWS Load Balancer
    # Controller's target-type: ip, source is the ALB ENI in-VPC) and from
    # Prometheus for scraping is allowed in.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # HTTPS out to AWS APIs (DynamoDB, Secrets Manager) - VPC endpoints
    # recommended in production to keep this off the public internet entirely.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
