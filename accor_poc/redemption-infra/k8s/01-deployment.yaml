apiVersion: apps/v1
kind: Deployment
metadata:
  name: redemption-app
  namespace: redemption
  labels:
    app: redemption-app
spec:
  replicas: 6 # baseline steady-state; HPA takes over from here
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop capacity during a rollout - zero downtime target
      maxSurge: 1
  selector:
    matchLabels:
      app: redemption-app
  template:
    metadata:
      labels:
        app: redemption-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: redemption-app
      automountServiceAccountToken: true

      # Spread pods evenly across AZs and across nodes so a single AZ outage
      # or single node loss never takes out more than a fraction of capacity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: redemption-app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: redemption-app

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redemption-app
          image: <ECR_REPO_URI>/redemption-app:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi

          # Startup probe covers slow JVM/cold-start cases without punishing
          # liveness during that window.
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2

          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Readiness is deliberately stricter than liveness - checks
          # downstream DynamoDB connectivity so we pull a pod from the
          # Service the moment it can't actually serve deductions.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2

          env:
            - name: POINTS_TABLE_NAME
              value: the-redemption-points-ledger
            - name: AWS_REGION
              value: ap-southeast-1

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30
